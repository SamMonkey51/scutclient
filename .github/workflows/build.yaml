name: Build for RAX3000M (ImmortalWrt 24.10)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: rax3000m-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: aarch64_cortex-a53 / ImmortalWrt 24.10-SNAPSHOT
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare OpenWrt package feed
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's|^SRCDIR:=.*|SRCDIR:=/feed|' openwrt/Makefile
          mkdir -p feed/scutclient
          cp openwrt/Makefile feed/scutclient/Makefile

      - name: Build package
        uses: immortalwrt/gh-action-sdk@master
        env:
          ARCH: aarch64_cortex-a53-24.10-SNAPSHOT
          CONTAINER: immortalwrt/sdk
          NO_DEFAULT_FEEDS: 1
          NO_SHFMT_CHECK: 1
          PACKAGES: scutclient
          V: s

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: scutclient-immortalwrt-24.10-aarch64_cortex-a53
          path: bin/packages/aarch64_cortex-a53/action/*.ipk
          if-no-files-found: error
          retention-days: 30
